services:
  truenas-postgres-backup:
    build:
      context: .
      dockerfile: Dockerfile
    image: truenas-postgres-backup:latest
    container_name: truenas-postgres-backup
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # TrueNAS Host / PostgreSQL Server Connection
      - POSTGRES_HOST=192.168.1.100
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=your_secure_postgres_password
      - POSTGRES_DATABASE=postgres
      - POSTGRES_SSL=false
      - NODE_ENV=production
      # TrueNAS App Login Credentials (automatically synced on container start)
      - TRUENAS_ADMIN_USERNAME=it-admin
      - TRUENAS_ADMIN_EMAIL=it-admin@truenas.local
      - TRUENAS_ADMIN_PASSWORD=ChangeMe_TrueNAS_Admin_2026!
      - SESSION_SECRET=change-this-to-a-64-char-random-hex-string
      - SESSION_INACTIVITY_MINUTES=15
      - AUTH_DATA_DIR=/app/data
    volumes:
      # Persist user accounts, TOTP MFA secrets, and audit logs across container restarts
      - ./data:/app/data

